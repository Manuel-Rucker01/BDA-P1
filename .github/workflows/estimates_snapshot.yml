# Daily analyst-estimate snapshot (Yahoo Finance via yfinance; free, no key, no secrets).
#
# Builds a point-in-time history of consensus EPS / revenue estimates, EPS trend
# (now vs 7/30/60/90 days ago) and up/down revision counts for the bot's universe
# (DataAnalysisPipeline2/trading_agent/data/estimates_universe.txt + the tickers of
# the newest ops/predictions file). Yahoo only serves the *current* consensus, so the
# history starts on the first run date: nothing can be backfilled.
#
# Each run writes estimates/YYYY/YYYY-MM-DD.parquet (asof_date = UTC fetch date,
# available_date = next weekday) and commits it to the orphan branch
# `data/estimates` (created on the first run), so main's history stays small.
# Offline: `python -m DataAnalysisPipeline2.v3.estimates load` or
# `estimates.load_branch_snapshots()`.
#
# Research data only: nothing here touches the model or the trading path.
# Note: scheduled workflows only run from the default branch, and GitHub pauses
# schedules on public repos after 60 days without repository activity.
name: Estimates snapshot (daily)

on:
  schedule:
    # 22:30 UTC Mon-Fri = after the US close in both EST (21:00 UTC) and EDT (20:00 UTC).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Fetch only the first N tickers (empty = full universe)"
        required: false
        default: ""

permissions:
  contents: write   # push the daily parquet to the data/estimates branch

concurrency:
  group: bda-estimates-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATA_BRANCH: data/estimates
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the snapshot needs (same pins as requirements-bot.txt).
      - run: pip install numpy==1.26.4 pandas==2.3.3 pyarrow==23.0.1 yfinance==1.2.0

      - name: Fetch snapshot
        id: snap
        # Throttled to 4 requests/s over 4 workers, 3 retries with backoff per ticker,
        # per-ticker failures tolerated; stops starting new tickers after 40 minutes and
        # writes what it has. Exit 2 = written but 0q coverage below 30% (reported as a
        # failure after the commit so GitHub emails you).
        run: |
          LIMIT="${{ inputs.limit }}"
          ARGS=""; [ -n "$LIMIT" ] && ARGS="--limit $LIMIT"
          set +e
          python -m DataAnalysisPipeline2.v3.estimates snapshot --out "$RUNNER_TEMP/est" \
            --max-minutes 40 --rate 4 --workers 4 --min-coverage 0.30 $ARGS | tee snap.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" = "0" ] || [ "$RC" = "2" ]

      - name: Commit to data/estimates
        run: |
          git config user.name "bda-estimates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" databranch "origin/$DATA_BRANCH"
          else
            echo "branch $DATA_BRANCH missing -- creating it as an orphan branch"
            git worktree add --detach databranch
            git -C databranch checkout --orphan "$DATA_BRANCH"
            git -C databranch rm -rfq .
            printf '%s\n' "# data/estimates" "" \
              "Daily analyst-estimate snapshots (Yahoo via yfinance), written by" \
              ".github/workflows/estimates_snapshot.yml on the default branch." \
              "One file per UTC fetch day: estimates/YYYY/YYYY-MM-DD.parquet." \
              "Schema and PIT rules: DataAnalysisPipeline2/v3/estimates.py." > databranch/README.md
            git -C databranch add README.md
          fi
          cp -R "$RUNNER_TEMP/est/estimates" databranch/
          cd databranch
          git add estimates
          ASOF=$(sed -n 's/^ESTIMATES_JSON: //p' ../snap.log | python -c 'import sys,json; print(json.load(sys.stdin)["asof_date"])')
          git commit -qm "estimates snapshot $ASOF" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git push origin "HEAD:refs/heads/$DATA_BRANCH" && exit 0
            sleep $((i * 10))
            git pull --rebase origin "$DATA_BRANCH" || true
          done
          echo "push failed"; exit 1

      - name: Coverage check
        if: steps.snap.outputs.rc == '2'
        run: |
          echo "0q coverage below the 30% floor -- see the job summary (Yahoo outage or rate limit?)"
          exit 1
